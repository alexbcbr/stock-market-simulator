name: Claude Review

# Claude Code reviews a PR into main, using AWS Bedrock (us-west-2) via OIDC.
# Runs ONLY when the "claude-review" label is added to the PR (cost control).
# Add it with: gh pr edit <n> --add-label claude-review   (or /open-pr claude-review)
# Or run it by hand: gh workflow run claude-review.yml -f pr_number=<n>   (needs the workflow on main)
# Required repo variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN       e.g. arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
#   BEDROCK_MODEL_ID   Bedrock model / inference-profile ID enabled in us-west-2
on:
  pull_request:
    branches: [main]
    types: [labeled]
  # Manual run: Actions > Claude Review > Run workflow (pick the main branch) and enter the PR number.
  # Re-reviews a PR without removing and re-adding the label.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write # required for AWS OIDC

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Manual runs start from the chosen branch, so check out the PR head instead.
          # Empty means the default checkout (the PR merge ref on label runs).
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          # Temporary: prints Claude's full output (and any denied tool) in the job log.
          # Remove once a review has been confirmed to land on a PR.
          show_full_output: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            Review this pull request. Focus on bugs, security issues
            (secrets, injection, unsafe AWS/IAM config) and readability.
            Be concise and cite file and line numbers.

            Use `gh pr diff` and `gh pr view` to read the change. Post inline comments
            for specific issues, then post ONE summary comment on the PR with
            `gh pr comment`. If there is nothing to report, still post a short
            summary comment saying the review found no issues.
          # Without these permissions Claude can review but cannot write anything to the PR.
          claude_args: |
            --model ${{ vars.BEDROCK_MODEL_ID }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
