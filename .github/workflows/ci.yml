name: CI

# Runs on PRs into main (before merge) and on pushes to main (after merge).
# Pushes to dev don't trigger it; use "Run workflow" for a manual run on any branch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write # needed by report-failure to open/comment on issues

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Ruff lint
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

  # Opens (or comments on) a GitHub issue when CI fails on main.
  # Skipped for PR runs: the red check on the PR is enough.
  report-failure:
    needs: [lint-python] # add new jobs here (tests, security)
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          body="CI failed on commit ${GITHUB_SHA::7}. Run: $RUN_URL"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Later:
  # test-backend:      cd trade-backend-k8s && uv run pytest
  # security:          dependency audit / SAST (or a separate security.yml)
