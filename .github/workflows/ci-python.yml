name: CI Python

# Runs on PRs into main (before merge) and on pushes to main (after merge).
# Pushes to dev don't trigger it; use "Run workflow" for a manual run on any branch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write # needed by report-failure to open/comment on issues

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Output is saved to ruff.log so report-failure can put it in the issue.
      - name: Ruff lint
        run: |
          set -o pipefail
          uvx ruff check . --output-format=concise 2>&1 | tee ruff.log

      - name: Ruff format check
        if: ${{ !cancelled() }} # still run (and log) when lint failed
        run: |
          set -o pipefail
          uvx ruff format --check . 2>&1 | tee -a ruff.log

      - name: Upload lint log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-python-log
          path: ruff.log

  # Type-check each uv project with the Pyright CLI. Pyright must be pointed at the
  # project's own .venv (uvx runs it in an isolated env that doesn't see the project deps).
  pyright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every project even if one fails
      matrix:
        include:
          - project: trade-backend-python
          - project: trade-ai-claude-agent-sdk
          - project: trade-ai
          - project: trade-ai-microsoft-agent-framework
          - project: trade-ai-crewai
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --frozen

      # Version pinned so a new Pyright release can't break CI on its own; bump it on purpose.
      - name: Pyright
        run: |
          set -o pipefail
          uvx pyright@1.1.414 --pythonpath .venv/bin/python 2>&1 | tee pyright.log

      - name: Upload Pyright log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-${{ matrix.project }}-log
          path: ${{ matrix.project }}/pyright.log

  # Same command as local `make unit-test-python`: one pytest run for all Python projects, inside the
  # trade-backend-python environment (its pyproject.toml also holds the pytest config).
  tests:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1" # never update uv.lock in CI
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --project trade-backend-python

      - name: Pytest
        run: |
          set -o pipefail
          make unit-test-python 2>&1 | tee pytest.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-log
          path: pytest.log

  # Opens (or comments on) a GitHub issue when CI fails on main.
  # Skipped for PR runs: the red check on the PR is enough.
  report-failure:
    needs: [lint-python, pyright, tests] # add new jobs here (security)
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download failure logs
        continue-on-error: true # no log if a job without log upload failed
        uses: actions/download-artifact@v4
        with:
          pattern: "*-log"
          path: logs

      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          {
            echo "CI failed on commit ${GITHUB_SHA::7}. Run: $RUN_URL"
            for f in logs/*/*.log; do
              [ -f "$f" ] || continue
              echo
              echo "### $(basename "$(dirname "$f")")"
              echo '````'
              head -c 30000 "$f"
              echo '````'
            done
          } > body.md
          # GitHub caps bodies at 65536 chars
          head -c 60000 body.md > body.trimmed.md
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.trimmed.md
          else
            gh issue create --title "$title" --body-file body.trimmed.md
          fi

  # Later:
  # security:          dependency audit / SAST (or a separate security.yml)
