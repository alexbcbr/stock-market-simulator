[project]
name = "trade-ai-slack-bot"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt==1.30.0",
    "slack-cli-hooks<1.0.0",
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.2",
]

[tool.setuptools]
py-modules = ["app"]

[tool.ruff]
line-length = 125
exclude = [".venv", "venv"]

[tool.ruff.format]
quote-style = "double"
